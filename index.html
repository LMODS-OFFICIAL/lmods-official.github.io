const $=id=>document.getElementById(id);const db=supabase.createClient('https://dbvdcyliixckvgehuusr.supabase.co','sb_publishable_mk3GTw_yptCah-66TyT6HQ_B9YxdIx_');let apps=[],settings={},editing=null;function url(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}function el(tag,t){let e=document.createElement(tag);if(t)e.textContent=t;return e}function link(t,u){let a=el('a',t);a.href=url(u);a.target='_blank';a.rel='noopener noreferrer';a.style.display='block';a.style.margin='12px 0';return a}function btn(t,f){let b=el('button',t);b.onclick=f;return b}function check(r){if(r.error)throw r.error;return r.data}function report(e){$('status').textContent=e.message||String(e)}async function safe(f){try{await f()}catch(e){report(e)}}let category='All Apps';const categories=['All Apps','Aplikasi Mod','Games','Streaming','Music','Tools','Editor'];function modView(raw){let box=el('div');box.className='modbox';let title=el('div','MOD INFO');title.className='modtitle';box.append(title);for(let line of String(raw||'').split(/\r?\n/)){line=line.trim();let bad=/^[-−✗✘❌]/u.test(line);let t=line.replace(/^[+\-−•✓✔✅✗✘❌\s]+/u,'').trim();if(!t)continue;let row=el('div');row.className='modline';let mark=el('span',bad?'×':'✓');mark.className='modmark'+(bad?' bad':'');mark.setAttribute('aria-label',bad?'Tidak work':'Work');row.append(mark,el('span',t));box.append(row)}return box}const mf=$('appform').elements.mod_info;function previewMod(){$('modpreview').replaceChildren(modView(mf.value))}mf.addEventListener('input',previewMod);function addMark(mark){mf.value+=(mf.value&&!mf.value.endsWith('\n')?'\n':'')+mark+' ';mf.focus();mf.setSelectionRange(mf.value.length,mf.value.length);previewMod()}$('addcheck').onclick=()=>addMark('+');$('addcross').onclick=()=>addMark('-');for(let k of categories.slice(1)){let o=el('option',k);o.value=k;$('appcategory').append(o)}function drawCats(){let d=$('cats');d.replaceChildren();for(let k of categories){let '📥 DOWNLOAD',a.download_url));for(let [t,k] of [['🎥 CARA DOWNLOAD','tutorial_url'],['☕ DUKUNG','donation_url']]){if(url(settings[k]))d.append(link(t,settings[k]));else{let b=el('button',t);b.disabled=true;b.title='Link belum diatur';b.style='display:block;width:100%;margin:12px 0;opacity:.55';d.append(b)}}$('download').showModal()}async function load(){apps=check(await db.from('apps').select('*').order('created_at',{ascending:false}));settings=check(await db.from('settings').select('*').eq('id',1).single());$('brand').textContent=settings.brand_name||'L MODS || OFFICIAL';$('description').textContent=settings.description||'KATALOG APLIKASI';$('avatar').replaceChildren();if(url(settings.profile_url)){let i=el('img');i.src=url(settings.profile_url);i.style='width:48px;height:48px;border-radius:50%;object-fit:cover';$('avatar').append(i)}else $('avatar').textContent='LM';$('navbrand').textContent=$('brand').textContent;$('navavatar').replaceChildren(...Array.from($('avatar').childNodes).map(n=>n.cloneNode(true)));$('links').replaceChildren();for(let [t,k] of [['Telegram','telegram_url'],['🎥 Cara Download','tutorial_url']])if(url(settings[k])){let a=link(t,settings[k]);if(k==='telegram_url'){let icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('width','19');icon.setAttribute('height','19');icon.style='vertical-align:middle;margin-right:7px';let p=document.createElementNS(icon.namespaceURI,'path');p.setAttribute('fill','#29A9EB');p.setAttribute('d','M22 2L2 10l7 3 3 7 3-7 7-11z M9 13L22 2');icon.append(p);a.prepend(icon)}$('links').append(a)}$('support').hidden=false;$('supportlink').replaceChildren();$('supportlink').append(url(settings.donation_url)?link('☕ DUKUNG',settings.donation_url):el('small','Link dukungan belum tersedia.'));render();if(!$('admin').hidden)manage()}
async function owner(){let {data:{user}}=await db.auth.getUser();if(!user)return false;let r=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();return !r.error&&!!r.data}async function auth(){let yes=await owner();$('admin').hidden=true;$('adminopen').hidden=!yes;$('mode').textContent=yes?'Owner Mode':'Guest Mode';$('loginopen').hidden=yes;if(yes){for(let k of ['brand_name','description','profile_url','ad_url','tutorial_url','telegram_url','donation_url'])$('settingsform').elements[k].value=settings[k]||'';manage()}return yes}let managePage=1;const pageSize=10;$('managesearch').oninput=()=>{managePage=1;manage()};function manage(){let m=$('manage');m.replaceChildren();let list=apps.filter(a=>a.name.toLowerCase().includes($('managesearch').value.trim().toLowerCase()));let total=Math.max(1,Math.ceil(list.length/pageSize));managePage=Math.min(managePage,total);for(let a of list.slice((managePage-1)*pageSize,managePage*pageSize)){let p=el('div');p.className='manage-row';p.append(el('span',a.name));p.append(btn('Edit',()=>{editing=a.id;for(let k of ['name','version','mod_info','image_url','download_url','category'])$('appform').elements[k].value=a[k]||'';$('appcategory').value=categories.slice(1).includes(a.category)?a.category:'Aplikasi Mod';previewMod();$('appform').scrollIntoView()}),btn('Hapus',()=>safe(async()=>{if(confirm('Hapus '+a.name+'?')){check(await db.from('apps').delete().eq('id',a.id));await load()}})));m.append(p)}if(!list.length)m.append(el('p','Tidak ada aplikasi.'));let pages=$('managepages');pages.replaceChildren();function go(n){managePage=n;manage()}let prev=btn('‹',()=>go(managePage-1));prev.disabled=managePage===1;pages.append(prev);let nums=[...new Set([1,...Array.from({length:5},(_,i)=>managePage+i-2).filter(n=>n>0&&n<=total),total])].sort((a,b)=>a-b);let last=0;for(let n of nums){if(last&&n-last>1)pages.append(el('span','…'));let b=btn(String(n),()=>go(n));if(n===managePage)b.setAttribute('aria-current','page');pages.append(b);last=n}let next=btn('›',()=>go(managePage+1));next.disabled=managePage===total;pages.append(next);let count=el('small',`Halaman ${managePage} dari ${total} · ${list.length} aplikasi`);count.style='width:100%;text-align:center';pages.append(count)}async function upload(f){if(!f||!f.size)return '';if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)||f.size>5*1024*1024)throw Error('Foto harus PNG/JPG/WebP/GIF maksimal 5 MB');let path=crypto.randomUUID()+'.'+f.type.split('/')[1];check(await db.storage.from('images').upload(path,f));return db.storage.from('images').getPublicUrl(path).data.publicUrl}function values(form,keys){let o={};for(let k of keys)o[k]=form.elements[k].value.trim();return o}$('appform').onsubmit=e=>{e.preventDefault();safe(async()=>{let f=e.target,o=values(f,['name','version','mod_info','image_url','download_url','category']);if(!url(o.download_url))throw Error('Link download tidak valid');o.image_url=await upload(f.elements.photo.files[0])||o.image_url;check(await(editing===null?db.from('apps').insert(o):db.from('apps').update(o).eq('id',editing)));editing=null;f.reset();previewMod();await load();$('status').textContent='Aplikasi disimpan.'})};$('settingsform').onsubmit=e=>{e.preventDefault();safe(async()=>{let f=e.target,o=values(f,['brand_name','description','profile_url','ad_url','tutorial_url','telegram_url','donation_url']);if(!o.donation_url&&!Object.prototype.hasOwnProperty.call(settings,'donation_url'))delete o.donation_url;else if(o.donation_url&&!url(o.donation_url))throw Error('Link donasi tidak valid');o.profile_url=await upload(f.elements.photo.files[0])||o.profile_url;check(await db.from('settings').update(o).eq('id',1));await load();await auth();$('status').textContent='Pengaturan disimpan.'})};$('clear').onclick=()=>{editing=null;$('appform').reset();previewMod()};$('search').oninput=render;$('menu').onclick=()=>$('nav').showModal();$('loginopen').onclick=()=>{$('nav').close();$('login').showModal()};$('loginform').onsubmit=async e=>{e.preventDefault();try{let f=e.target;check(await db.auth.signInWithPassword({email:f.elements.email.value,password:f.elements.password.value}));if(!await auth()){await db.auth.signOut();throw Error('Akun bukan admin');}f.reset();$('login').close();$('admin').hidden=false;$('admin').scrollIntoView()}catch(e){$('loginstatus').textContent=e.message}};$('logout').onclick=()=>safe(async()=>{check(await db.auth.signOut());await auth()});$('adminopen').onclick=()=>{$('nav').close();$('admin').hidden=false;$('admin').scrollIntoView()};$('searchtoggle').onclick=()=>{$('search').hidden=!$('search').hidden;if(!$('search').hidden)$('search').focus();else{$('search').value='';render()}};drawCats();previewMod();safe(async()=>{await load();await auth();if(location.hash.startsWith('#app-')){let a=apps.find(a=>String(a.id)===decodeURIComponent(location.hash.slice(5)));if(a)detail(a)}});</script></body></html>
